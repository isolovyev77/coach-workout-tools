version: 2
project_name: cap-pp-cli
changelog:
  disable: true
builds:
  - id: cap-pp-cli
    main: ./cmd/cap-pp-cli
    binary: cap-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X cap-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: cap-pp-mcp
    main: ./cmd/cap-pp-mcp
    binary: cap-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: cap-pp-cli
    repository:
      owner: isolovyev
      name: homebrew-tap
    homepage: "https://github.com/isolovyev/cap-pp-cli"
    description: "Read the CrossFit Affiliate Programming (CAP) daily class plans and weekly overviews. The affiliate toolkit at..."
    install: |
      bin.install "cap-pp-cli"
      bin.install "cap-pp-mcp"
