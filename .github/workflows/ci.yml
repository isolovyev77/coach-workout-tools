name: Verify package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - name: Check public-release safety
        run: |
          python3 scripts/verify-public-release.py
          python3 scripts/test_verify_public_release.py
      - name: Check shell scripts
        run: |
          bash -n scripts/install.sh
          bash -n scripts/update.sh
      - name: Test BTWB CLI
        working-directory: cli/btwb
        run: go test -mod=readonly ./...
      - name: Test Trenda CLI
        working-directory: cli/trenda
        run: go test -mod=readonly ./...
